name: E-Commerce Recommender CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # STAGE 1: Code Quality, Linting & Static Analysis
  # ============================================================================
  code-quality:
    name: 🔍 Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run Flake8 Linter
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 app src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Enforce coding style per .flake8 config
          flake8 app src tests --count --statistics

  # ============================================================================
  # STAGE 2: Automated Unit and Integration Testing
  # ============================================================================
  test-and-evaluate:
    name: 🧪 Pytest Matrix (Py ${{ matrix.python-version }})
    needs: code-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Runtime & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serving.txt
          pip install pytest pytest-cov httpx

      - name: Execute Pytest Suite with Coverage
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov=src/models \
            --cov=src/recommendation \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload Test Coverage Artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.xml
          retention-days: 7

  # ============================================================================
  # STAGE 3: Automated ML Model Quality Gate
  # ============================================================================
  model-quality-gate:
    name: 🎯 Model Quality Gate
    needs: test-and-evaluate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate Model Production Criteria
        run: |
          python scripts/ci_model_gate.py

  # ============================================================================
  # STAGE 4: Container Build & Live Smoke Test
  # ============================================================================
  docker-smoke-test:
    name: 🐳 Docker Build & Health Smoke Test
    needs: model-quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Test Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ecommerce-recommendation-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Launch Container in CI Runner
        run: |
          docker run -d --name test-api -p 8000:8000 ecommerce-recommendation-api:ci-test
          echo "Waiting for container startup..."
          sleep 8
          docker ps -a
          docker logs test-api

      - name: Run Container Health & Inference Probes
        run: |
          # 1. Health Probe with connection retry
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8000/health
          echo -e "\n[SUCCESS] /health probe passed."

          # 2. Root Metadata Probe
          curl --fail --retry 5 --retry-connrefused http://localhost:8000/
          echo -e "\n[SUCCESS] / root metadata probe passed."

          # 3. Popularity Endpoint Probe
          curl --fail --retry 5 --retry-connrefused "http://localhost:8000/popular?top_n=5"
          echo -e "\n[SUCCESS] /popular endpoint probe passed."

          # 4. Recommendation Inference Probe (Cold Start Fallback)
          curl --fail --retry 5 --retry-connrefused "http://localhost:8000/recommend/999999?top_n=5"
          echo -e "\n[SUCCESS] /recommend cold-start probe passed."

      - name: Container Cleanup
        if: always()
        run: |
          docker logs test-api
          docker stop test-api || true
          docker rm test-api || true

  # ============================================================================
  # STAGE 5: Container Registry Push & Cloud Deployment
  # ============================================================================
  publish-and-deploy:
    name: 🚀 Publish & Deploy to Registry
    needs: docker-smoke-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Cloud Platform Deployment (Webhook)
        if: env.DEPLOY_HOOK_URL != ''
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering cloud deploy hook..."
          curl -X POST "$DEPLOY_HOOK_URL"
