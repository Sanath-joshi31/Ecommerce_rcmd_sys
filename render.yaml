services:
  - type: web
    name: ecommerce-recommendation-api
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements-serving.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PYTHONUNBUFFERED
        value: "1"
