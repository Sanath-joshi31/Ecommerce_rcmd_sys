version: '3.8'

services:
  recommendation-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-recommendation-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OPENBLAS_NUM_THREADS=1
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./artifacts/approved:/app/artifacts/approved:ro
